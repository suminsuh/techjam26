# RIFT training config with OpenAI CLIP ViT-B/16 on CUDA (RTX 4060)
seed: 42
image_size: 224
device: cuda

model:
  spatial_backbone: vit_base_patch16_clip_224
  pretrained: true
  embed_dim: 256
  dropout: 0.2

train:
  epochs: 10
  batch_size: 16
  lr: 1.0e-4
  weight_decay: 0.05
  num_workers: 0
  official_aug_prob: 0.70
  consistency_weight: 0.5
  amp: true
  save_dir: checkpoints/clip

data:
  train_dir: data/sid_set/train
  val_dir: data/sid_set/val
  holdout_dir: data/wildfake_holdout

eval:
  threshold_source: clean_val
  target_fpr: 0.05
  batch_size: 16
  tta: true
  output_dir: outputs/clip_eval
  conditions:
    - clean
    - jpeg_90
    - jpeg_70
    - jpeg_50
    - jpeg_30
    - blur_0.5
    - blur_1.0
    - blur_2.0
    - resize_0.5
    - resize_0.25
    - noise_0.02
    - noise_0.05
    - noise_0.10
    - color_jitter
    - center_crop_0.8

predict:
  batch_size: 16
  tta: true
  checkpoint: checkpoints/clip/best.pt
